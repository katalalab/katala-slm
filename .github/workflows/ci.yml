name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The publish gate existed only as a script an operator had to remember to run,
  # and the operator's own home paths reached the published tree anyway. Running it
  # as a job is the difference between a checklist item and a gate.
  no-instance-data:
    uses: katalalab/.github/.github/workflows/instance-data-gate.yml@main

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: cargo test --quiet
